plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "org.tomlj:tomlj:1.1.1"
        implementation "dev.rikka.shizuku:api:13.1.5"
        implementation "dev.rikka.shizuku:provider:13.1.5"
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.hazemtech.termux.hometty"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 118
        versionName "0.118.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.hazemtech.termux.hometty"
        manifestPlaceholders.TERMUX_APP_NAME = "HomeTTY"
        manifestPlaceholders.TERMUX_API_APP_NAME = "HomeTTY:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "HomeTTY:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "HomeTTY:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "HomeTTY:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "HomeTTY:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "HomeTTY:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("hometty_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("hometty_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

// Never embed stock com.termux binaries in the longer HomeTTY prefix.
// A launcher-only development build has no bootstrap. Production builds must
// provide rebuilt archives and their audited manifest (see docs/BOOTSTRAP.md).
def bootstrapDir = providers.environmentVariable("HOMETTY_BOOTSTRAP_DIR")
android.defaultConfig.buildConfigField "boolean", "HOMETTY_HAS_BOOTSTRAP", bootstrapDir.isPresent().toString()
tasks.register("prepareHomeTTYBootstrap", Exec) {
    commandLine "python3", rootProject.file("scripts/prepare_bootstrap.py"),
        bootstrapDir.getOrElse(""), project.file("src/main/cpp")
}
tasks.named("preBuild").configure { dependsOn("prepareHomeTTYBootstrap") }

// Bundle companions built from the pinned sources and signed by the same local
// debug identity. Android still requires consent for each APK installation.
def x11CompanionApk = providers.environmentVariable("HOMETTY_X11_APK")
def companionAssets = layout.buildDirectory.dir("generated/homettyCompanions/debug")
def bundleCompanions = tasks.register("bundleHomeTTYDebugCompanions") {
    dependsOn(":hometty-api:assembleDebug", ":hometty-widget:assembleDebug", ":hometty-tasker:assembleDebug")
    ["api", "widget", "tasker"].each { name ->
        inputs.files(project(":hometty-${name}").layout.buildDirectory.dir("outputs/apk/debug"))
    }
    inputs.property("includesX11", x11CompanionApk.isPresent())
    if (x11CompanionApk.isPresent()) inputs.file(x11CompanionApk)
    outputs.dir(companionAssets)
    doLast {
        def output = companionAssets.get().dir("companions").asFile
        output.mkdirs()
        def oldX11 = new File(output, "x11.apk")
        if (oldX11.exists() && !oldX11.delete()) throw new GradleException("Cannot replace generated X11 companion asset")
        if (x11CompanionApk.isPresent()) {
            def x11 = file(x11CompanionApk.get())
            if (!x11.isFile()) throw new GradleException("HOMETTY_X11_APK must point to the built HomeTTY shared-UID X11 APK")
            copy { from x11; into output; rename { "x11.apk" } }
        }
        ["api", "widget", "tasker"].each { name ->
            def apks = fileTree(project(":hometty-${name}").layout.buildDirectory.dir("outputs/apk/debug")) {
                include "*.apk"
            }.files
            if (apks.size() != 1) throw new GradleException("Expected exactly one ${name} companion APK")
            copy { from apks.first(); into output; rename { "${name}.apk" } }
        }
    }
}
android.sourceSets.debug.assets.srcDir(bundleCompanions)
tasks.matching { it.name == "mergeDebugAssets" }.configureEach { dependsOn(bundleCompanions) }
// AGP's lint model reads generated asset directories separately from mergeAssets.
tasks.matching { it.name.contains("Debug") && it.name.toLowerCase(java.util.Locale.ROOT).contains("lint") }.configureEach {
    dependsOn(bundleCompanions)
}
